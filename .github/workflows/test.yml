name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        run: npm test

      - name: Build static site
        run: npm run build

      - name: Verify clean build output
        run: |
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 8
          test "$(find dist -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 0
